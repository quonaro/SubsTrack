<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0f1115" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <title>SubsTrack</title>
    <!-- Paints the last theme before the first frame. Mirrors theme.ts#applyCachedTheme —
         without it a light theme flashes the dark CSS defaults while the DB reads. -->
    <script>
      ;(() => {
        try {
          const cache = JSON.parse(localStorage.getItem('substrack:theme') ?? 'null')
          if (!cache?.css) return
          let mode = cache.themeMode
          if (mode !== 'light' && mode !== 'dark') {
            mode = window.matchMedia?.('(prefers-color-scheme: light)').matches ? 'light' : 'dark'
          }
          const root = document.documentElement
          root.classList.toggle('light', mode === 'light')
          root.style.cssText = cache.css[mode] ?? ''
          const bg = cache.bg?.[mode] ?? (mode === 'light' ? '#f5f6f8' : '#0f1115')
          root.style.backgroundColor = bg
          document.querySelector('meta[name="theme-color"]')?.setAttribute('content', bg)
        } catch {
          // Storage blocked — keep the CSS defaults.
        }
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
