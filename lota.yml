# lota.yml — SubsTrack project tasks

install:
  desc: Install dependencies (pnpm)
  script: pnpm install

dev:
  web:
    desc: Vite dev server on :7358 (SQLite via sql.js + IndexedDB in browser)
    color: green
    script: pnpm dev

  android:
    desc: Live-reload on Android — app WebView loads from vite :7358 (boots an AVD if none connected)
    color: green
    script: |
      # Boot an emulator if no device/emulator is connected
      if ! adb devices | grep -qw device; then
        AVD="$("$ANDROID_HOME/emulator/emulator" -list-avds | head -1)"
        [ -n "$AVD" ] && nohup "$ANDROID_HOME/emulator/emulator" -avd "$AVD" >/dev/null 2>&1 &
        adb wait-for-device
        adb shell 'while [ -z "$(getprop sys.boot_completed)" ]; do sleep 1; done'
      fi
      # always rebuild the web bundle so the installed APK is never stale
      pnpm exec vite build
      # cap run -l needs existing synced assets to rewrite (cap run syncs dist→assets itself)
      [ -f android/app/src/main/assets/capacitor.config.json ] || pnpm exec cap sync android
      # reuse an already-running dev server on :7358, otherwise start one
      if ! curl -sf -o /dev/null http://localhost:7358/; then
        pnpm dev &
        VITE_PID=$!
        trap 'kill $VITE_PID 2>/dev/null' EXIT
        sleep 2
      fi
      # adb reverse makes the app's localhost:7358 reach the host vite server
      pnpm exec cap run android --live-reload --host localhost --port 7358 --forwardPorts 7358:7358

build:
  desc: Build targets
  color: red

  web:
    desc: Full build — wasm copy + typecheck + vite build → dist/
    script: pnpm build

  apk:
    desc: Android debug APK → app-debug.apk (installs as substrack.app.dev alongside prod substrack.app)
    script: pnpm build && pnpm exec cap sync android && cd android && ./gradlew assembleDebug

  apk:release:
    desc: Android release APK signed with android/keystore.properties
    script: pnpm build && pnpm exec cap sync android && cd android && ./gradlew assembleRelease

preview:
  desc: Preview the production build from dist/
  script: pnpm preview

typecheck:
  desc: Typecheck (vue-tsc --noEmit)
  script: pnpm typecheck

test:
  desc: Vitest suite (domain logic + real-SQLite tests via sql.js)
  script: pnpm test

lint:
  desc: Biome check (lint + format verify)
  script: pnpm lint

lint:fix:
  desc: Biome — apply safe fixes and reformat
  script: pnpm lint:fix

cap:
  sync:
    desc: Build web bundle and sync into android/
    script: pnpm cap:sync

  android:
    desc: Sync + open Android Studio
    script: pnpm cap:android

push:
  desc: Push main; `lota push v*.*.*` also pushes the tag → release workflow
  color: cyan
  args:
    - "tag:str?"
  script: |
    set -e
    git push origin main
    if [ -n "${tag:-}" ]; then
      git tag -f "$tag" 2>/dev/null || git tag "$tag"
      git push -f origin "$tag"
    fi
